<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1026">
  <title>Play-Along Scorekeeper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="scorebar">
    <div class="score-main">
      <span class="label">Score</span>
      <span id="score" class="score">$0</span>
    </div>
    <div class="score-side">
      <div><span class="label">Coryat</span><span id="coryat">$0</span></div>
      <div><span class="label">Right / Wrong</span><span id="rw">0 / 0</span></div>
      <div><span class="label">Accuracy</span><span id="acc">—</span></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Round">
    <button role="tab" data-round="J">Jeopardy!</button>
    <button role="tab" data-round="DJ">Double Jeopardy!</button>
    <button role="tab" data-round="FJ">Final</button>
  </nav>

  <main>
    <section id="board" class="board" aria-label="Clue board"></section>

    <section id="final" class="final" hidden>
      <h2>Final Jeopardy!</h2>
      <p id="finalNote" class="hint"></p>
      <div class="wager-row">
        <label for="fjWager">Your wager</label>
        <input id="fjWager" type="number" inputmode="numeric" min="0" step="1">
        <button id="fjAllIn" class="btn small" type="button">All in</button>
      </div>
      <p id="fjError" class="error" role="alert"></p>
      <div class="choices two">
        <button id="fjRight" class="btn right" type="button">✓ Got it</button>
        <button id="fjWrong" class="btn wrong" type="button">✗ Missed it</button>
      </div>
      <p id="finalResult" class="final-result"></p>
      <button id="fjClear" class="link" type="button" hidden>Clear Final result</button>
    </section>
  </main>

  <footer class="actions">
    <button id="undo" class="btn ghost" type="button">↶ Undo</button>
    <button id="newGame" class="btn ghost" type="button">New game</button>
    <button id="historyBtn" class="btn ghost" type="button">History</button>
  </footer>

  <dialog id="clueDialog" aria-label="Score this clue">
    <button class="close" data-act="close" aria-label="Close">×</button>
    <div id="clueBody"></div>
  </dialog>

  <dialog id="newDialog" aria-label="Start a new game">
    <button class="close" data-act="cancel" aria-label="Close">×</button>
    <h2>Start a new game?</h2>
    <p id="newSummary" class="hint"></p>
    <div class="choices stack">
      <button class="btn right" data-act="save">Save to history &amp; start new</button>
      <button class="btn wrong" data-act="discard">Discard &amp; start new</button>
      <button class="btn ghost" data-act="cancel">Cancel</button>
    </div>
  </dialog>

  <dialog id="historyDialog" aria-label="Game history">
    <button class="close" data-act="close" aria-label="Close">×</button>
    <h2>History</h2>
    <div id="historyBody"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
